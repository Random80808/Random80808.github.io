<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YZY's Game Hub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #1c1c1c;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    input {
      margin-top: 10px;
      padding: 10px;
      width: 80%;
      max-width: 400px;
      border-radius: 8px;
      border: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .game {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .game:hover {
      background: #333;
      transform: scale(1.05);
    }

    iframe {
      width: 90%;
      height: 400px;
      border: none;
      margin-top: 20px;
      border-radius: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 YZY's UNBLOCKED GAMES</h1>
  <input type="text" id="search" placeholder="Search games..." onkeyup="filterGames()">
</header>

<div class="grid" id="gameGrid">

  <div class="game" onclick="loadGame('https://sites.google.com/view/unblocked-game76/madalin-stunt-cars-2-unblocked')">
    🏁 Madalin stunt cars 2
  </div>

  <div class="game" onclick="loadGame('https://turbowarp.org/2/embed')">
    🚀 Game 2
  </div>

  <div class="game" onclick="loadGame('https://turbowarp.org/3/embed')">
    🧠 Game 3
  </div>

  <div class="game" onclick="loadGame('https://turbowarp.org/4/embed')">
    🏁 Game 4
  </div>

</div>

<iframe id="gameFrame"></iframe>

<script>
  function loadGame(url) {
    document.getElementById("gameFrame").src = url;
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function filterGames() {
    let input = document.getElementById("search").value.toLowerCase();
    let games = document.getElementsByClassName("game");

    for (let i = 0; i < games.length; i++) {
      let text = games[i].innerText.toLowerCase();
      games[i].style.display = text.includes(input) ? "block" : "none";
    }
  }
</script>

</body>
</html>
